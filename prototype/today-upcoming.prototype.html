<!doctype html>
<!--
  PROTOTYPE — throwaway.
  ROUND 5 answers wayfinder ticket "How are Tasks and Events added, dated and placed from Today?"
  Three structurally different ways to edit, all on the settled C4 layout (?variant=E1|E2|E3, ← → to cycle):
     E1 Type it       — one command line at the bottom. Words set the day, a time range makes an Event, @event places,
                        >task makes a Sub-task, "someday" undates. Tap anything to load it into the line and retype it.
     E2 Plus + form   — a + button opens a form sheet (Task | Event, day chips, Event chips, Sub-task of). Tap anything to open the same form.
     E3 Drag + inline — "+ ..." fields right where things go (in Event cards, Anytime, Later, Someday). Drag a Task onto
                        an Event (place), a day chip (date + unplace), Anytime (unplace) or the Someday tab; drag an Event onto a day
                        chip to move it. On a phone, press and hold to drag. Tap for a small menu (rename, times, + Sub-task, delete).
  Rules the prototype applies (open for challenge): placing sets the item's day; re-dating a Task brings its open Sub-tasks
  and clears their Placements; moving an Event brings its placed Tasks; adding the first Sub-task to a placed Task moves
  the Placement onto the Sub-task; a Sub-task can't go to Someday on its own; editing an Occurrence changes only that one.

  Earlier rounds answered "What should Today + Upcoming look and feel like?"
  Round 1 had three structurally different variants (?variant=A|B|C). C (Now / Next) won.
  Round 3 cycles C4/C5: C2's tabs (Later today / Earlier today / Someday) + C3's Done meter, Done above or below the tabs.
  Round 2 (C1–C3, via ?variant=): same top (date strip, Now, Next, Anytime), three takes on Later today / Earlier today / Someday.
  A and B are still reachable via ?variant=A|B. Open the file in a browser; no build, no persistence; ?t=HH:MM sets the clock.
  A: Timeline   — hour grid with Event blocks, unplaced Tasks in an "Anytime" tray, Upcoming as a side column
  B: Checklist  — one list of Tasks, Events are section headers, Upcoming in a slide-out drawer
  C: Now / Next — focus card(s) for the live Event(s), rest of day compressed, Upcoming as a day strip on top
     C1 Rail  — Earlier folds above Now; Later is a time rail with free gaps; Someday in a bottom sheet
     C2 Tabs  — Later / Done / Someday as one segmented list
     C3 Cards — Later as a sideways card row; Done as a meter + chips; Someday is the last chip in the date strip
  The dev bar also fakes the clock (+1h, ⏭ midnight to see Carry-over and Skipped) and toggles a phone-width frame.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE · Today + Upcoming</title>
<style>
  :root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1f;--mute:#6b6b70;--line:#e3e1dc;--accent:#2f6fde;--accent-soft:#e6eefc;--warn:#b5560d;--warn-soft:#fdf0e4;--ok:#2f8a4c;--ghost:#9a9aa0}
  @media (prefers-color-scheme:dark){:root{--bg:#161618;--card:#202023;--ink:#ececee;--mute:#9a9aa2;--line:#33333a;--accent:#7aa5ff;--accent-soft:#22304d;--warn:#f0a35c;--warn-soft:#3a2a1b;--ok:#6fcf8f;--ghost:#6e6e76}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:90px}
  button{font:inherit;color:inherit;cursor:pointer}
  #frame{margin:0 auto;max-width:1180px;padding:16px}
  body.phone #frame{max-width:390px;border-left:1px dashed var(--line);border-right:1px dashed var(--line);min-height:100vh}
  h1,h2,h3{margin:0}
  .mute{color:var(--mute)} .small{font-size:12.5px}
  .badge{display:inline-block;font-size:11px;padding:1px 6px;border-radius:9px;background:var(--line);color:var(--mute);margin-left:6px;vertical-align:1px;white-space:nowrap}
  .badge.carry{background:var(--warn-soft);color:var(--warn)}
  .badge.recur{background:var(--accent-soft);color:var(--accent)}
  .item{display:flex;gap:8px;align-items:flex-start;padding:4px 0}
  .item .tick{flex:none;width:18px;height:18px;border:1.5px solid var(--mute);border-radius:5px;background:none;padding:0;margin-top:1px;display:grid;place-items:center;font-size:12px;line-height:1}
  .item.done .tick{background:var(--ok);border-color:var(--ok);color:#fff}
  .item.done .label{color:var(--mute)}
  .item.skipped .label{text-decoration:line-through;color:var(--ghost)}
  .item.ghost{color:var(--ghost);font-style:italic}
  .item.parent .tick{border-style:dashed;cursor:default}
  .ctx{font-size:11.5px;color:var(--mute)}
  .banner{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:13.5px;display:flex;justify-content:space-between;gap:8px}
  .banner button{background:none;border:0;color:inherit}
  .someday summary{cursor:pointer;color:var(--mute);font-size:13px;padding:6px 0}
  input[type=date]{font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:2px 6px}

  /* ---------- Variant A: Timeline ---------- */
  .a-wrap{display:grid;grid-template-columns:1fr 300px;gap:20px}
  body.phone .a-wrap{grid-template-columns:1fr}
  @media (max-width:760px){.a-wrap{grid-template-columns:1fr}}
  .a-head{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
  .a-tray{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:14px}
  .a-tray h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin-bottom:4px}
  .a-tl{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px}
  .a-hour{position:absolute;left:0;right:0;border-top:1px solid var(--line);font-size:11px;color:var(--mute);padding-left:8px}
  .a-ev{position:absolute;background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:8px;padding:4px 8px;overflow:auto;font-size:13px}
  .a-ev.past{opacity:.6}
  .a-ev .t{font-weight:600}
  .a-ev .item{padding:1px 0}
  .a-now{position:absolute;left:44px;right:0;border-top:2px solid #e0453a;z-index:3}
  .a-now::before{content:"";position:absolute;left:-5px;top:-5px;width:8px;height:8px;border-radius:50%;background:#e0453a}
  .a-up{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;align-self:start;position:sticky;top:12px}
  .a-up h2{font-size:15px;margin-bottom:8px}
  .a-day{border-top:1px solid var(--line);padding:8px 0}
  .a-day:first-of-type{border-top:0}
  .a-day .d{font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
  .a-up .row{font-size:13.5px;padding:2px 0;display:flex;gap:6px}
  .a-up .row .tm{color:var(--mute);min-width:42px;font-variant-numeric:tabular-nums}
  .a-up .row.ghost{color:var(--ghost);font-style:italic}

  /* ---------- Variant B: Checklist ---------- */
  .b-wrap{max-width:620px;margin:0 auto}
  .b-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .b-top h1{font-size:28px}
  .b-upbtn{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 14px}
  .b-sec{margin-bottom:16px}
  .b-sec>.h{display:flex;gap:10px;align-items:baseline;border-bottom:1px solid var(--line);padding:6px 0;margin-bottom:4px}
  .b-sec>.h .tm{font-variant-numeric:tabular-nums;font-weight:600;min-width:96px}
  .b-sec>.h .ti{font-weight:600}
  .b-sec.now>.h{border-bottom:2px solid var(--accent)}
  .b-sec.now>.h .tm{color:var(--accent)}
  .b-sec.past{opacity:.6}
  .b-sec .empty{font-size:13px;color:var(--ghost);padding:2px 0}
  .b-sec.carry>.h .ti{color:var(--warn)}
  .b-subs{margin-left:26px}
  .b-drawer{position:fixed;top:0;right:0;bottom:0;width:min(340px,88vw);background:var(--card);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.12);padding:16px;overflow:auto;transform:translateX(100%);transition:transform .2s;z-index:20}
  .b-drawer.open{transform:none}
  .b-drawer .d{margin-top:12px;font-weight:600}
  .b-drawer .row{font-size:14px;padding:3px 0 3px 10px;display:flex;gap:8px}
  .b-drawer .row .tm{color:var(--mute);min-width:42px}
  .b-drawer .row.ghost{color:var(--ghost);font-style:italic}

  /* ---------- Variant C: Now / Next ---------- */
  .c-strip{display:flex;gap:8px;overflow-x:auto;padding:7px 7px 6px 0;margin-bottom:14px}
  .c-chip{flex:none;min-width:66px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:6px 8px;text-align:center}
  .c-chip.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .c-chip .n{font-size:20px;font-weight:700;line-height:1.1}
  .c-chip .w{font-size:11px;text-transform:uppercase;letter-spacing:.05em}
  .c-chip .dots{font-size:10px;letter-spacing:1px;min-height:12px}
  .c-main{max-width:640px;margin:0 auto}
  .c-now{background:var(--accent);color:#fff;border-radius:18px;padding:16px 18px;margin-bottom:12px}
  .c-live{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:12px}
  .c-live .c-now{margin-bottom:0}
  .c-live .c-now h2{font-size:20px}
  .c-now.also{background:var(--accent-soft);color:var(--ink)}
  .c-now.also .bar{background:var(--line)} .c-now.also .bar i{background:var(--accent)}
  .c-now.also .item .tick{border-color:var(--mute)} .c-now.also .ctx{color:var(--mute)}
  .c-now .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;opacity:.8}
  .c-now h2{font-size:24px;margin:2px 0}
  .c-now .bar{height:5px;background:rgba(255,255,255,.3);border-radius:3px;margin:8px 0 10px}
  .c-now .bar i{display:block;height:100%;background:#fff;border-radius:3px}
  .c-now .item .tick{border-color:#fff}
  .c-now .ctx{color:rgba(255,255,255,.75)}
  .c-now .item.done .label{color:rgba(255,255,255,.7)}
  .c-next{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
  .c-next .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}
  .c-later{display:flex;flex-direction:column;gap:2px;margin-bottom:14px}
  .c-later .r{display:flex;gap:10px;padding:6px 4px;border-bottom:1px solid var(--line);font-size:14px}
  .c-later .r .tm{font-variant-numeric:tabular-nums;color:var(--mute);min-width:48px}
  .c-pills{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
  .c-pill{display:flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:5px 12px 5px 6px;font-size:14px}
  .c-pill.done{opacity:.6}
  .c-pill .tick{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--mute);background:none;padding:0;font-size:11px}
  .c-pill.done .tick{background:var(--ok);border-color:var(--ok);color:#fff}
  .c-pill.carry{border-color:var(--warn)}
  .c-sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:10px 0 4px}
  .c-other{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}



  .c-r{display:flex;gap:10px;padding:4px 0} .c-r .tm{color:var(--mute);min-width:42px;font-variant-numeric:tabular-nums}
  .someday-chip{border-style:dashed} .someday-chip .dots{font-size:10px;letter-spacing:0}
  /* C1 rail */
  .rail{position:relative;margin:4px 0 14px 4px}
  .rail::before{content:"";position:absolute;left:55px;top:6px;bottom:6px;width:2px;background:var(--line)}
  .rail-row{display:flex;gap:12px;align-items:flex-start;padding:5px 0;position:relative}
  .rail-row .tm{min-width:44px;font-variant-numeric:tabular-nums;color:var(--mute);font-size:13.5px;padding-top:1px}
  .rail-row .dot{flex:none;width:14px;height:14px;border-radius:50%;background:var(--card);border:2px solid var(--accent);margin-top:3px;z-index:1;font-size:9px;display:grid;place-items:center;color:#fff}
  .rail-row .dot.ok{background:var(--ok);border-color:var(--ok)}
  .rail-row.past{color:var(--mute)} .rail-row.past .dot:not(.ok){border-color:var(--mute)}
  .rail-gap{margin-left:70px;font-size:12px;color:var(--ok);padding:3px 0}
  .rail-fold{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px dashed var(--line);padding:6px 0;margin-bottom:10px;font-size:13.5px}
  .footer-link{display:block;margin:8px auto 0;background:none;border:1px dashed var(--line);border-radius:20px;padding:6px 16px;color:var(--mute)}
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:30}
  .sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(640px,100vw);background:var(--card);border-radius:18px 18px 0 0;padding:10px 18px 90px;z-index:31;box-shadow:0 -8px 30px rgba(0,0,0,.2)}
  .sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
  /* C2 tabs */
  .seg{display:flex;background:var(--line);border-radius:12px;padding:3px;gap:3px;margin:4px 0 10px}
  .seg button{flex:1;border:0;background:none;border-radius:9px;padding:7px 4px;font-size:14px;color:var(--mute)}
  .seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
  .seg button{display:flex;align-items:center;justify-content:center;gap:6px}
  .seg .n{font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;min-width:20px;height:18px;line-height:18px;padding:0 6px;border-radius:9px;background:rgba(127,127,127,.15);color:var(--mute)}
  .seg button.on .n{background:var(--accent);color:#fff}
  .seg .sd-ic{font-size:11px;opacity:.7;display:none}
  .seg button.sd.on{font-style:italic}
  .tab-body.sd{border-style:dashed;background:transparent}
  .sd-note{font-size:12px;color:var(--mute);font-style:italic;padding:6px 0 2px}
  .cnt{display:inline-block;font-size:10.5px;font-weight:600;min-width:18px;height:16px;line-height:16px;padding:0 5px;border-radius:8px;background:var(--line);text-align:center;letter-spacing:0;margin-left:4px}
  .c-more{border:1px dashed var(--line);background:none;border-radius:20px;padding:5px 12px;font-size:13.5px;color:var(--accent)}
  .c-chip{position:relative}
  .c-stripwrap{display:flex;gap:8px;align-items:stretch;margin-bottom:14px}
  .c-stripwrap .c-strip{flex:1;min-width:0;margin-bottom:0}
  .c-pick{position:relative;flex:none;width:58px;margin:7px 0 6px;border:1px dashed var(--mute);background:none;border-radius:12px;font-size:10.5px;line-height:1.2;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
  .c-pick .ic{font-size:16px}
  .c-pick input{position:absolute;inset:0;opacity:0;pointer-events:none;width:100%;height:100%}
  .c-chip .x{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:10px;line-height:18px}
  .tab-body{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 14px;min-height:120px}
  .tab-row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
  .tab-row:last-child{border-bottom:0}
  .tab-row .rel{font-size:12.5px;color:var(--accent);white-space:nowrap}
  .tab-row.past b{color:var(--mute)} .tab-row .rel.ok{color:var(--ok)} .tab-row .rel.warn{color:var(--warn)}
  .tab-group{font-size:12px;font-weight:600;color:var(--mute);margin-top:8px}
  /* C3 cards */
  .lcards{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
  .lcard{flex:none;width:150px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
  .lcard .tm{font-size:12px;color:var(--accent);font-weight:600} .lcard .ti{font-weight:600;margin:2px 0}
  .meter{height:8px;background:var(--line);border-radius:4px;overflow:hidden} .meter i{display:block;height:100%;background:var(--ok)}
  /* ---------- Round 5: editing (E1 Type it / E2 Plus + form / E3 Drag + inline), all on the C4 layout ---------- */
  body.emode{padding-bottom:210px}
  .e-it,.e-ev{cursor:pointer}
  .e-link{text-decoration:underline dotted;cursor:pointer}
  .e-tip{font-size:12.5px;color:var(--mute);margin:-6px 0 10px}
  body.e3 [data-drag]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  body.e-dragging{user-select:none;cursor:grabbing}
  body.e-dragging [data-drop]{outline:1px dashed var(--mute);outline-offset:2px}
  .e-over{outline:2px solid var(--accent)!important;outline-offset:2px;background-image:linear-gradient(var(--accent-soft),var(--accent-soft))}
  .c-now.e-over{background-image:none}
  .e-ghost{position:fixed;z-index:60;pointer-events:none;background:var(--card);color:var(--ink);border:1px solid var(--accent);border-radius:20px;padding:4px 12px;box-shadow:0 6px 18px rgba(0,0,0,.25);font-size:14px}
  #ebar{position:fixed;left:50%;transform:translateX(-50%);bottom:62px;width:min(640px,96vw);background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 6px 24px rgba(0,0,0,.15);padding:6px 12px 8px;z-index:40;display:none}
  #ebar.editing{border-color:var(--accent)}
  #eline{width:100%;font:inherit;font-size:16px;border:0;background:none;color:var(--ink);outline:none;padding:6px 0}
  #epv{font-size:13px;color:var(--accent);min-height:18px} #epv.err{color:var(--warn)} #epv.mute{color:var(--mute)}
  #ehint{font-size:11.5px;color:var(--mute);margin-top:2px} #ehint code{background:var(--bg);border-radius:4px;padding:0 4px}
  #ehint button{font-size:11.5px;border:1px solid var(--line);background:none;border-radius:6px;padding:0 6px;color:#d33}
  #efab{position:fixed;right:max(16px,calc(50vw - 330px));bottom:70px;width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:40;display:none;place-items:center}
  #etoast{position:fixed;left:50%;top:12px;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:20px;padding:6px 14px;font-size:13.5px;z-index:70;display:none;max-width:92vw}
  #esheet .sheet{max-height:86vh;overflow:auto}
  .e-chips{display:flex;flex-wrap:wrap;gap:6px}
  .e-chip{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:4px 10px;font-size:13.5px;display:inline-flex;gap:4px;align-items:center}
  .e-chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .e-field{margin:12px 0} .e-field>.l{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin-bottom:5px}
  .e-in{font:inherit;width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--bg);color:var(--ink)}
  .e-in.title{font-size:18px;font-weight:600}
  .e-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
  .e-row label{flex:1;font-size:12px;color:var(--mute)}
  .e-btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 14px}
  .e-btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)} .e-btn.del{color:#d33} .e-btn.push{margin-left:auto}
  .e-err{color:var(--warn);font-size:13px;margin-top:8px}
  .e-add{font:inherit;font-size:14px;border:1px dashed var(--line);border-radius:20px;padding:5px 12px;background:none;color:var(--ink);width:100%;margin-top:6px;outline:none}
  .e-add:focus{border-style:solid;border-color:var(--accent)}
  .c-now:not(.also) .e-add{border-color:rgba(255,255,255,.55);color:#fff} .c-now:not(.also) .e-add::placeholder{color:rgba(255,255,255,.75)}
  .e-ghostrow{color:var(--ghost);font-style:italic;font-size:14px;padding:3px 0}
  /* ---------- Switcher / dev bar (not part of the design) ---------- */
  #pbar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:50;display:flex;gap:4px;align-items:center;background:#111;color:#fff;border-radius:30px;padding:6px 8px;box-shadow:0 6px 24px rgba(0,0,0,.35);font:13px system-ui;white-space:nowrap;max-width:96vw;overflow-x:auto}
  #pbar button{background:#2a2a2e;border:0;color:#fff;border-radius:20px;padding:5px 10px}
  #pbar button:hover{background:#3a3a40}
  #pbar .lbl{padding:0 8px;font-weight:600;min-width:150px;text-align:center}
  #pbar .sep{width:1px;height:18px;background:#444;margin:0 4px}
  #pstate{position:fixed;right:12px;bottom:70px;width:min(460px,92vw);max-height:55vh;overflow:auto;background:#111;color:#cfe;font:11.5px/1.35 ui-monospace,monospace;padding:10px;border-radius:10px;z-index:49;display:none;white-space:pre}
  #pstate.open{display:block}
</style>
</head>
<body>
<div id="frame"><div id="app"></div></div>
<pre id="pstate"></pre>
<div id="pbar">
  <button data-act="prev" title="Previous variant (←)">←</button>
  <span class="lbl" id="vlabel"></span>
  <button data-act="next" title="Next variant (→)">→</button>
  <span class="sep"></span>
  <span id="clock" style="padding:0 6px"></span>
  <button data-act="back" title="Clock back 15 min">−15m</button>
  <input id="slider" type="range" min="360" max="1435" step="5" title="Drag to set the time" style="width:120px">
  <button data-act="fwd" title="Clock forward 15 min">+15m</button>
  <button data-act="midnight" title="Jump to next day: runs Carry-over and Skipped">⏭ midnight</button>
  <span class="sep"></span>
  <button data-act="phone" title="Toggle phone-width frame">📱</button>
  <button data-act="state" title="Show state">{ }</button>
  <button data-act="pile" title="Add 3 open and 3 done Tasks today, to test long lists">+6 Tasks</button>
  <button data-act="reset" title="Reset sample data">↺</button>
</div>

<script>
/* ===================== sample data + model (shared, in memory only) ===================== */
const BASE = new Date(2026, 10, 16); // Mon 16 Nov 2026 = day 0
const dateOf = d => new Date(BASE.getFullYear(), BASE.getMonth(), BASE.getDate() + d);
const dow = d => dateOf(d).getDay();
const fmtDay = (d, opts = { weekday: 'short', day: 'numeric', month: 'short' }) => dateOf(d).toLocaleDateString('en-GB', opts);
const hm = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const ruleText = r => r.daily ? 'daily' : r.every ? `every ${r.every} days` : r.weekdays ? (r.weekdays.length === 5 ? 'weekdays' : r.weekdays.map(w => ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][w]).join('/')) : '';
const matches = (r, d) => r.daily ? true : r.every ? d >= r.from && (d - r.from) % r.every === 0 : r.weekdays ? r.weekdays.includes(dow(d)) : false;

const RECUR_TASKS = [
  { rid: 'vit', title: 'Take vitamins', rule: { daily: true } },
  { rid: 'plants', title: 'Water plants', rule: { every: 3, from: -2 } },
  { rid: 'review', title: 'Weekly review', rule: { weekdays: [5] } },
];
const RECUR_EVENTS = [
  { rid: 'run', title: 'Morning run', start: 420, end: 450, rule: { weekdays: [1, 2, 3, 4, 5] } },
  { rid: 'standup', title: 'Standup', start: 570, end: 585, rule: { weekdays: [1, 2, 3, 4, 5] } },
];

let S, nid;
function reset() {
  nid = 1;
  S = { day: 0, time: 615, events: [], tasks: [], banner: null, maxEvDay: -1, upOpen: false, selDay: 0, extraDay: null };
  const ev = (date, title, start, end, extra = {}) => { const e = { id: 'e' + nid++, title, date, start, end, ...extra }; S.events.push(e); return e; };
  const tk = (title, date, extra = {}) => { const t = { id: 't' + nid++, title, date, eventId: null, done: null, carried: 0, parentId: null, recurId: null, skipped: false, ...extra }; S.tasks.push(t); return t; };

  const deep = ev(0, 'Deep work', 540, 660);
  ev(0, 'Lunch with Sam', 750, 810);
  ev(0, 'Dentist', 960, 1005);
  const errands = ev(0, 'Errands', 1020, 1080);
  const evening = ev(0, 'Evening focus', 1200, 1260);
  ev(0, 'Call with Mum', 1035, 1065);
  const laundry = ev(0, 'Laundry', 1020, 1110);
  ev(1, 'Yoga', 1080, 1140); ev(2, 'Team offsite', 600, 960); ev(3, 'Haircut', 720, 750);
  ev(5, "Dinner at Priya's", 1170, 1290); ev(9, 'Flight to Lisbon', 480, 660);
  materializeEvents(0, 13);

  const run = S.events.find(e => e.recurId === 'run' && e.date === 0);
  const rep = tk('Write report', 0);
  tk('Collect figures', 0, { parentId: rep.id, carried: 1 });
  tk('Draft intro', 0, { parentId: rep.id, eventId: deep.id, done: 580 });
  tk('Outline section 2', 0, { parentId: rep.id, eventId: deep.id });
  tk('Proofread & send', 0, { parentId: rep.id, eventId: evening.id });
  tk("Review Alex's PR", 0, { eventId: deep.id });
  tk('Buy stamps', 0, { eventId: errands.id });
  tk('Return library books', 0, { eventId: errands.id });
  tk('Pay electricity bill', 0, { carried: 1 });
  tk('Reply to landlord', 0);
  tk('Fold clothes', 0, { eventId: laundry.id });
  tk('Stretch 10 min', 0, { eventId: run.id, done: 445 });
  tk('Take vitamins', 0, { recurId: 'vit', done: 470 });
  tk('Water plants', 0, { recurId: 'plants', carried: 2 }); // occurrence from day -2, still unfinished
  tk('Submit expense claim', 1); tk('Renew passport form', 3); tk('Call grandma', 6); tk('Pack for Lisbon', 8);
  ['Learn Spanish basics', 'Fix bike light', 'Sort photos', 'Research new laptop'].forEach(t => tk(t, null));
}
const PILE = ['Book car service', 'Email accountant', 'Order printer ink', 'Plan weekend', 'Cancel old gym', 'Update CV', 'Back up phone', 'Clean desk', 'Buy birthday card', 'Check bank statement', 'Read chapter 4', 'Tidy downloads'];
function pile() {
  for (let i = 0; i < 6; i++) {
    const title = PILE[(S.tasks.length + i) % PILE.length];
    S.tasks.push({ id: 't' + nid++, title, date: S.day, eventId: null, done: i % 2 ? Math.max(420, S.time - 20 * i) : null, carried: 0, parentId: null, recurId: null, skipped: false });
  }
}
function materializeEvents(from, to) {
  for (let d = Math.max(from, S.maxEvDay + 1); d <= to; d++)
    RECUR_EVENTS.forEach(r => matches(r.rule, d) && S.events.push({ id: 'e' + nid++, title: r.title, date: d, start: r.start, end: r.end, recurId: r.rid }));
  S.maxEvDay = Math.max(S.maxEvDay, to);
}
const subsOf = id => S.tasks.filter(t => t.parentId === id);
const isOpen = t => !t.done && !t.skipped;
const eventAt = (d, m) => S.events.filter(e => e.date === d && e.start <= m && m < e.end).sort((a, b) => b.start - a.start)[0];
const evById = id => S.events.find(e => e.id === id);

function tick(id) {
  const t = S.tasks.find(x => x.id === id);
  if (!t || t.skipped || subsOf(t.id).length) return; // parents complete via their Sub-tasks
  t.done = t.done ? null : S.time;
  if (t.parentId) { const p = S.tasks.find(x => x.id === t.parentId); p.done = subsOf(p.id).every(s => s.done) ? S.time : null; }
}
function midnight() {
  const old = S.day; S.day++; S.time = 480; S.selDay = S.day;
  const carried = [], skipped = [];
  S.tasks.filter(t => t.date === old && !t.parentId && isOpen(t)).forEach(t => {
    t.date = S.day; t.carried++; t.eventId = null;
    subsOf(t.id).filter(isOpen).forEach(s => { s.date = S.day; s.eventId = null; s.carried++; });
    carried.push(t.title);
  });
  RECUR_TASKS.forEach(r => {
    if (!matches(r.rule, S.day)) return;
    S.tasks.filter(t => t.recurId === r.rid && isOpen(t)).forEach(t => { t.skipped = true; subsOf(t.id).filter(isOpen).forEach(s => s.skipped = true); skipped.push(t.title); const i = carried.indexOf(t.title); if (i >= 0) carried.splice(i, 1); });
    S.tasks.push({ id: 't' + nid++, title: r.title, date: S.day, eventId: null, done: null, carried: 0, parentId: null, recurId: r.rid, skipped: false });
  });
  materializeEvents(S.day, S.day + 13);
  S.banner = { carried, skipped };
}

/* day queries */
const eventsOn = d => S.events.filter(e => e.date === d).sort((a, b) => a.start - b.start);
const placedIn = eid => S.tasks.filter(t => t.eventId === eid && !t.skipped);
const topTasksOn = d => S.tasks.filter(t => t.date === d && !t.parentId && !t.skipped);
const unplacedOn = d => topTasksOn(d).filter(t => !t.eventId && !(subsOf(t.id).length && subsOf(t.id).every(s => s.eventId)));
const ghostsOn = d => d > S.day ? RECUR_TASKS.filter(r => matches(r.rule, d)) : [];
const recurOf = t => (RECUR_TASKS.find(r => r.rid === t.recurId) || RECUR_EVENTS.find(r => r.rid === t.recurId));
const someday = () => S.tasks.filter(t => t.date === null);

/* shared bits (small fragments only; each variant owns its layout) */
function badges(t) {
  let b = '';
  if (t.recurId) b += `<span class="badge recur" title="Recurrence: ${ruleText(recurOf(t).rule)}">↻ ${ruleText(recurOf(t).rule)}</span>`;
  if (t.carried && isOpen(t)) b += `<span class="badge carry" title="Carry-over">↪ carried ${t.carried}d</span>`;
  if (t.skipped) b += `<span class="badge">skipped</span>`;
  return b;
}
function doneNote(t) {
  if (!t.done || subsOf(t.id).length) return '';
  const placed = t.eventId && evById(t.eventId), covers = placed && placed.start <= t.done && t.done < placed.end;
  const e = covers ? placed : eventAt(t.date, t.done); // overlap: prefer the Event it was placed in
  return `<div class="ctx">${hm(t.done)}${e ? ' · ' + esc(e.title) : ''}</div>`;
}
function item(t, { ctx = '', showDone = true } = {}) {
  const subs = subsOf(t.id);
  const cls = ['item', t.done && 'done', t.skipped && 'skipped', subs.length && 'parent'].filter(Boolean).join(' ');
  const prog = subs.length ? ` <span class="badge">${subs.filter(s => s.done).length}/${subs.length}</span>` : '';
  return `<div class="${cls}"><button class="tick" data-tick="${t.id}">${t.done ? '✓' : ''}</button><div class="label">${esc(t.title)}${prog}${badges(t)}${ctx ? `<div class="ctx">${ctx}</div>` : ''}${showDone ? doneNote(t) : ''}</div></div>`;
}
const parentCtx = t => t.parentId ? '↳ ' + esc(S.tasks.find(p => p.id === t.parentId).title) : '';
function subWhere(s) {
  if (s.eventId) { const e = evById(s.eventId); return `in ${esc(e.title)} ${hm(e.start)}`; }
  return 'unplaced';
}
function banner() {
  if (!S.banner) return '';
  const { carried, skipped } = S.banner;
  return `<div class="banner"><span>Overnight: ${carried.length ? `carried over <b>${carried.map(esc).join(', ')}</b> (Placements cleared)` : 'nothing carried over'}${skipped.length ? ` · skipped <b>${skipped.map(esc).join(', ')}</b>` : ''}</span><button data-act="dismiss">✕</button></div>`;
}
function somedayBlock() {
  const s = someday();
  return `<details class="someday"><summary>Someday (${s.length})</summary>${s.map(t => item(t)).join('')}</details>`;
}
function upcomingDays() { const a = []; for (let d = S.day + 1; d <= S.day + 7; d++) a.push(d); return a; }
function dayRows(d, cls) {
  const rows = [];
  eventsOn(d).forEach(e => rows.push({ k: e.start, h: `<div class="${cls}"><span class="tm">${hm(e.start)}</span><span>${esc(e.title)}${e.recurId ? ' ↻' : ''}${placedIn(e.id).length ? ` <span class="mute small">· ${placedIn(e.id).length} placed</span>` : ''}</span></div>` }));
  topTasksOn(d).forEach(t => rows.push({ k: 2000, h: `<div class="${cls}"><span class="tm">○</span><span>${esc(t.title)}${badges(t)}</span></div>` }));
  ghostsOn(d).forEach(r => rows.push({ k: 2001, h: `<div class="${cls}"><span class="tm">○</span><span>${esc(r.title)} <span class="badge recur">↻ ${ruleText(r.rule)}</span></span></div>` }));
  return rows.sort((a, b) => a.k - b.k).map(r => r.h).join('') || `<div class="mute small" style="padding-left:10px">nothing</div>`;
}
const openDayInput = () => `<div class="small mute" style="margin-top:10px">Open another day: <input type="date" data-act="openday" min="${dateOf(S.day).toISOString().slice(0, 10)}"></div>${S.extraDay !== null ? `<div style="margin-top:6px"><b>${fmtDay(S.extraDay)}</b>${dayRows(S.extraDay, 'row')}</div>` : ''}`;

/* ===================== Variant A: Timeline ===================== */
function VariantA() {
  const d = S.day, PX = 1.1, H0 = 6 * 60, H1 = 23 * 60;
  const y = m => (m - H0) * PX;
  const evs = eventsOn(d);
  // overlap columns
  const cols = []; evs.forEach(e => { let c = cols.findIndex(end => end <= e.start); if (c < 0) { c = cols.length; cols.push(0); } cols[c] = e.end; e._c = c; });
  evs.forEach(e => e._n = Math.max(...evs.filter(o => o.start < e.end && e.start < o.end).map(o => o._c)) + 1);
  let tl = '';
  for (let h = 6; h <= 23; h++) tl += `<div class="a-hour" style="top:${y(h * 60)}px">${String(h).padStart(2, '0')}</div>`;
  evs.forEach(e => {
    const w = `calc((100% - 52px) / ${e._n})`;
    tl += `<div class="a-ev ${e.end <= S.time ? 'past' : ''}" style="top:${y(e.start)}px;height:${Math.max(26, (e.end - e.start) * PX - 2)}px;left:calc(48px + ${w} * ${e._c});width:calc(${w} - 4px)">
      <div class="t">${esc(e.title)} <span class="mute small">${hm(e.start)}–${hm(e.end)}${e.recurId ? ' ↻' : ''}</span></div>
      ${placedIn(e.id).map(t => item(t, { ctx: parentCtx(t), showDone: false })).join('')}</div>`;
  });
  tl += `<div class="a-now" style="top:${y(S.time)}px"></div>`;
  const tray = unplacedOn(d);
  return `<div class="a-wrap"><div>
    <div class="a-head"><h1>Today</h1><span class="mute">${fmtDay(d, { weekday: 'long', day: 'numeric', month: 'long' })}</span></div>
    ${banner()}
    <div class="a-tray"><h3>Anytime today</h3>${tray.map(t => item(t) + (subsOf(t.id).length ? `<div style="margin-left:26px">${subsOf(t.id).map(s => item(s, { ctx: subWhere(s) })).join('')}</div>` : '')).join('') || '<div class="mute small">all placed</div>'}</div>
    <div class="a-tl" style="height:${y(H1) + 10}px">${tl}</div>
    ${somedayBlock()}
  </div>
  <aside class="a-up"><h2>Upcoming</h2>${upcomingDays().map(u => `<div class="a-day"><div class="d">${fmtDay(u)}</div>${dayRows(u, 'row')}</div>`).join('')}${openDayInput()}</aside></div>`;
}

/* ===================== Variant B: Checklist ===================== */
function VariantB() {
  const d = S.day;
  const carry = unplacedOn(d).filter(t => t.carried && isOpen(t));
  const anytime = unplacedOn(d).filter(t => !(t.carried && isOpen(t)));
  const withSubs = t => item(t) + (subsOf(t.id).length ? `<div class="b-subs">${subsOf(t.id).map(s => item(s, { ctx: subWhere(s) })).join('')}</div>` : '');
  let html = `<div class="b-wrap"><div class="b-top"><div><h1>Today</h1><div class="mute">${fmtDay(d, { weekday: 'long', day: 'numeric', month: 'long' })} · ${S.tasks.filter(t => t.date === d && !subsOf(t.id).length && t.done).length} done, ${S.tasks.filter(t => t.date === d && !subsOf(t.id).length && isOpen(t)).length} to go</div></div>
    <button class="b-upbtn" data-act="up">Upcoming ›</button></div>${banner()}`;
  if (carry.length) html += `<div class="b-sec carry"><div class="h"><span class="tm">↪</span><span class="ti">Carried over</span></div>${carry.map(withSubs).join('')}</div>`;
  html += `<div class="b-sec"><div class="h"><span class="tm">Anytime</span><span class="ti mute small">not placed in an Event</span></div>${anytime.map(withSubs).join('') || '<div class="empty">—</div>'}</div>`;
  eventsOn(d).forEach(e => {
    const now = e.start <= S.time && S.time < e.end, past = e.end <= S.time;
    const its = placedIn(e.id);
    html += `<div class="b-sec ${now ? 'now' : ''} ${past ? 'past' : ''}"><div class="h"><span class="tm">${hm(e.start)}–${hm(e.end)}</span><span class="ti">${esc(e.title)}</span>${e.recurId ? `<span class="badge recur">↻ ${ruleText(recurOf(e).rule)}</span>` : ''}${now ? '<span class="badge recur">now</span>' : ''}</div>
      ${its.map(t => item(t, { ctx: parentCtx(t) })).join('') || '<div class="empty">no Tasks placed</div>'}</div>`;
  });
  html += somedayBlock() + `</div>
  <div class="b-drawer ${S.upOpen ? 'open' : ''}"><div style="display:flex;justify-content:space-between"><h2>Upcoming</h2><button class="b-upbtn" data-act="up">✕</button></div>
  ${upcomingDays().map(u => `<div class="d">${fmtDay(u, { weekday: 'long', day: 'numeric', month: 'short' })}</div>${dayRows(u, 'row')}`).join('')}${openDayInput()}</div>`;
  return html;
}

/* ===================== Variant C: Now / Next, with three takes on Later / Earlier / Someday ===================== */
const dur = m => m >= 60 ? `${Math.floor(m / 60)}h${m % 60 ? ' ' + (m % 60) + 'm' : ''}` : `${m}m`;
function cStrip(d, withSomeday) {
  const days = [d, ...upcomingDays()];
  return `<div class="c-stripwrap"><div class="c-strip">${days.map(x => {
    const n = eventsOn(x).length, t = topTasksOn(x).filter(isOpen).length + ghostsOn(x).length;
    return `<button class="c-chip ${x === S.selDay ? 'sel' : ''}" data-sel="${x}"><div class="w">${x === d ? 'Today' : fmtDay(x, { weekday: 'short' })}</div><div class="n">${dateOf(x).getDate()}</div><div class="dots">${'▪'.repeat(Math.min(n, 4))}${'•'.repeat(Math.min(t, 4))}</div></button>`;
  }).join('')}${withSomeday ? `<button class="c-chip someday-chip ${S.selDay === 'S' ? 'sel' : ''}" data-sel="S"><div class="w">Someday</div><div class="n">${someday().length}</div><div class="dots">no date</div></button>` : ''}${pickedChip(d)}</div>${pickBtn(d)}</div>`;
}
/* "Open another day": a chip at the end of the strip that opens the date picker, limited to days after the 7 shown.
   The picked day shows up as its own chip (with ✕ to drop it), so the strip stays the one way to move between days. */
function pickedChip(d) {
  return S.extraDay !== null && S.extraDay > d + 7 ? `<button class="c-chip picked ${S.selDay === S.extraDay ? 'sel' : ''}" data-sel="${S.extraDay}"><div class="w">${fmtDay(S.extraDay, { weekday: 'short' })}</div><div class="n">${dateOf(S.extraDay).getDate()}</div><div class="dots">${fmtDay(S.extraDay, { month: 'short' })}</div><span class="x" data-act="unpick" title="Remove">✕</span></button>` : '';
}
function pickBtn(d) {
  const min = dateOf(d + 8), iso = x => `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`;
  return `<button class="c-pick" data-act="pick" title="Open a day after ${fmtDay(d + 7)}"><span class="ic">📅</span><span>Pick<br>a day</span><input type="date" id="pickday" data-act="openday" min="${iso(min)}" tabindex="-1"></button>`;
}
function cOtherDay(d) {
  return `<div class="c-other"><h2 style="margin-bottom:6px">${fmtDay(d, { weekday: 'long', day: 'numeric', month: 'long' })}</h2>${dayRows(d, 'c-r')}</div>`;
}
function cTop(d) {
  const evs = eventsOn(d);
  const live = evs.filter(e => e.start <= S.time && S.time < e.end).sort((a, b) => b.start - a.start); // latest started first
  const nextAt = evs.find(e => e.start > S.time)?.start;
  const nexts = evs.filter(e => e.start === nextAt); // Events starting together all count as Next
  let html = '';
  if (live.length) {
    const card = (now, i) => {
      const pct = Math.round(100 * (S.time - now.start) / (now.end - now.start));
      return `<div class="c-now ${i ? 'also' : ''}"><div class="lbl">${i ? 'Also now' : 'Now'} · ${hm(now.start)}–${hm(now.end)} · ${now.end - S.time} min left</div><h2>${esc(now.title)}${now.recurId ? ' ↻' : ''}</h2><div class="bar"><i style="width:${pct}%"></i></div>${placedIn(now.id).map(t => item(t, { ctx: parentCtx(t), showDone: false })).join('') || '<div style="opacity:.8">Nothing placed</div>'}</div>`;
    };
    html += live.length > 1 ? `<div class="c-sec">${live.length} Events at once</div><div class="c-live">${live.map(card).join('')}</div>` : card(live[0], 0);
  } else html += `<div class="c-now" style="background:var(--card);color:var(--ink);border:1px solid var(--line)"><div class="lbl">Now</div><h2>Free</h2><div class="mute">No Event right now — pick something from Anytime.</div></div>`;
  if (nexts.length) html += `<div class="c-next"><div class="lbl">Next · ${hm(nextAt)} (in ${dur(nextAt - S.time)})</div>${nexts.map(next => `<h3 style="margin:2px 0 4px">${esc(next.title)}</h3>${placedIn(next.id).map(t => item(t, { ctx: parentCtx(t) })).join('')}`).join('')}</div>`;
  const anytime = unplacedOn(d).flatMap(t => subsOf(t.id).length ? subsOf(t.id).filter(s => !s.eventId).map(s => ({ t: s, ctx: S.tasks.find(p => p.id === s.parentId).title })) : [{ t }])
    .filter(({ t }) => isOpen(t)).sort((a, b) => (b.t.carried > 0) - (a.t.carried > 0)); // done ones move to Done today; carried first
  const [shown, more] = capped(anytime, 6, 'moreAny');
  html += `<div class="c-sec">Anytime today <span class="cnt">${anytime.length}</span></div><div class="c-pills">${shown.map(({ t, ctx }) => `<span class="c-pill ${t.done ? 'done' : ''} ${t.carried && isOpen(t) ? 'carry' : ''}"><button class="tick" data-tick="${t.id}">${t.done ? '✓' : ''}</button>${esc(t.title)}${ctx ? ` <span class="ctx">· ${esc(ctx)}</span>` : ''}${t.recurId ? ' <span class="badge recur">↻</span>' : ''}${t.carried && isOpen(t) ? ` <span class="badge carry">↪${t.carried}d</span>` : ''}</span>`).join('')}${more}</div>`;

  else if (k === 'S') { r = M.addTask({ title: v, date: null }); msg = `Added “${v}” to Someday`; }
  else if (k === 'sub') { r = M.addTask({ title: v, parentId: x }); msg = `Added Sub-task “${v}”`; }
  else if (k === 'ev') { const p = parseLine(v); r = p.start === undefined ? 'Give the Event a time, e.g. Gym 18-19' : !p.title ? 'Give it a title' : M.addEvent({ title: p.title, date: p.date ?? +x, start: p.start, end: p.end }); msg = `Added Event “${p.title}”`; }
  if (!okOrFlash(r, msg)) return;
  render();
  const again = document.querySelector(`[data-add="${key}"]`); if (again) again.focus();
}
let drag = null, justDragged = false;
function validDrop(tg) { return drag.kind === 't' ? true : tg.startsWith('d:'); }
function startDrag(x, y) {
  drag.on = true; document.body.classList.add('e-dragging');
  const g = document.createElement('div'); g.className = 'e-ghost'; g.id = 'eghost'; g.textContent = (drag.kind === 'e' ? '▪ ' : '○ ') + drag.label; document.body.appendChild(g);
  if (navigator.vibrate) navigator.vibrate(15); moveDrag(x, y);
}
function moveDrag(x, y) {
  const g = document.getElementById('eghost'); g.style.left = x + 12 + 'px'; g.style.top = y + 12 + 'px';
  document.querySelectorAll('.e-over').forEach(n => n.classList.remove('e-over'));
  const el = document.elementFromPoint(x, y)?.closest('[data-drop]');

}
function endDrag() {
  if (!drag) return; clearTimeout(drag.timer);

}
function dropOn(kind, id, tg) {
  const [k, v] = tg.split(':');
  if (kind === 'e') { const e = evById(id); return okOrFlash(M.editEvent(e, { date: +v }), `Moved “${e.title}” to ${dayLabel(+v)}${placedIn(e.id).length ? ' with its placed Tasks' : ''}`); }
  const t = tById(id);
  if (k === 'e') { const e = evById(v); return okOrFlash(M.place(t, e), `Placed “${t.title}” in ${e.title} · ${dayLabel(e.date)}`); }
  if (k === 'd') { const r = M.date(t, +v); if (!r) M.unplace(t); return okOrFlash(r, `“${t.title}” → ${dayLabel(+v)}, not placed`); }
  if (tg === 'S') return okOrFlash(M.date(t, null), `“${t.title}” → Someday`);
}
document.addEventListener('pointerdown', e => {
  if (cur !== 'E3' || e.button > 0 || S.menu) return;
  const src = e.target.closest('#app [data-drag]'); if (!src || e.target.closest('input,select,[data-tick],[data-act]')) return;
  const [kind, id] = src.dataset.drag.split(':'), x = kind === 't' ? tById(id) : evById(id);
  drag = { kind, id, x0: e.clientX, y0: e.clientY, on: false, touch: e.pointerType !== 'mouse', label: x.title };
  if (drag.touch) drag.timer = setTimeout(() => drag && startDrag(drag.x0, drag.y0), 380);
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  if (drag.on) return moveDrag(e.clientX, e.clientY);
  if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 7) { if (drag.touch) { clearTimeout(drag.timer); drag = null; } else startDrag(e.clientX, e.clientY); }
});
document.addEventListener('touchmove', e => { if (drag?.on) { e.preventDefault(); const t = e.touches[0]; moveDrag(t.clientX, t.clientY); } }, { passive: false });
document.addEventListener('pointerup', endDrag);
document.addEventListener('touchend', endDrag);
document.addEventListener('contextmenu', e => { if (drag) e.preventDefault(); });
document.addEventListener('pointercancel', () => { if (drag && !drag.on) { clearTimeout(drag.timer); drag = null; } });
document.addEventListener('click', e => { if (justDragged) { e.stopPropagation(); e.preventDefault(); } }, true);

/* ---------- E wiring ---------- */
document.body.insertAdjacentHTML('beforeend', `<div id="ebar"><input id="eline" autocomplete="off" spellcheck="false" placeholder="Add anything… “Buy milk tomorrow” · “Gym 18-19 fri” · “Stamps @errands”"><div id="epv"></div><div id="ehint"></div></div><button id="efab" data-e="new" title="Add">+</button><div id="esheet"></div><div id="etoast"></div>`);
function openItem(k, id) {
  if (cur === 'E1') { E1ed = { k, id }; const i = document.getElementById('eline'); i.value = serialize(k, id); i.focus(); e1Preview(); return; }
  if (cur === 'E2') openDraft(k, id); else S.menu = { k, id };
  render();
}
document.addEventListener('click', e => {
  if (!cur.startsWith('E') || e.target.closest('[data-tick],[data-sel],[data-tab],[data-act],input,select,label')) return;
  const dc = e.target.closest('[data-d]'); if (dc) { const i = dc.dataset.d.indexOf(':'); draftSet(dc.dataset.d.slice(0, i), dc.dataset.d.slice(i + 1)); return render(); }
  const b = e.target.closest('[data-e]');
  if (b) {
    const a = b.dataset.e, m = S.menu, mt = m && (m.k === 't' ? tById(m.id) : evById(m.id));
    if (a === 'new') openDraft();
    else if (a === 'close') { S.draft = null; S.menu = null; }
    else if (a === 'd-save') saveDraft();
    else if (a === 'd-del') { const D = S.draft; D.kind === 't' ? M.delTask(tById(D.id)) : M.delEvent(evById(D.id)); flash(`Deleted “${D.title}”`); S.draft = null; }
    else if (a === 'opensub') openDraft('t', b.dataset.id);
    else if (a === 'e1del') { const x = E1ed; x.k === 't' ? M.delTask(tById(x.id)) : M.delEvent(evById(x.id)); flash('Deleted'); E1ed = null; document.getElementById('eline').value = ''; }
    else if (a === 'm-unplace') { M.unplace(mt); flash(`“${mt.title}” is no longer placed`); }
    else if (a === 'm-someday') { okOrFlash(M.date(mt, null), `“${mt.title}” → Someday`); S.menu = null; }
    else if (a === 'm-today') { M.date(mt, S.day); flash(`“${mt.title}” → Today`); S.menu = null; }
    else if (a === 'm-del') { m.k === 't' ? M.delTask(mt) : M.delEvent(mt); flash(`Deleted “${mt.title}”`); S.menu = null; }
    return render();
  }
  const o = e.target.closest('#app [data-open], #esheet [data-open]'); if (o) { const [k, id] = o.dataset.open.split(':'); openItem(k, id); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'eline') return e1Preview();
  const f = e.target.dataset.dfield; if (!f || !S.draft) return;
  if (f === 'pickdate') { if (e.target.value) { draftSet('date', isoDay(e.target.value)); render(); } return; }
  S.draft[f] = e.target.value;
  if (f === 'parentId') { draftSet('parentId', e.target.value || null); render(); }
});
document.addEventListener('change', e => {
  const f = e.target.dataset.m, m = S.menu; if (!f || !m) return;
  const x = m.k === 't' ? tById(m.id) : evById(m.id), v = e.target.value;
  if (f === 'title' && v.trim()) { x.title = v.trim(); flash('Renamed'); }
  if (f === 'start' || f === 'end') { const r = M.editEvent(x, { [f]: toMin(v) }); okOrFlash(r, `“${x.title}” now ${hm(x.start)}–${hm(x.end)}`); }
  render();
});
document.addEventListener('keydown', e => {
  if (!cur.startsWith('E')) return;
  if (e.key === 'Escape') { if (E1ed || e.target.id === 'eline') { E1ed = null; document.getElementById('eline').value = ''; e1Preview(); } S.draft = null; S.menu = null; render(); return; }
  if (e.key === 'Enter' && e.target.id === 'eline') return e1Submit();
  if (e.key === 'Enter' && e.target.dataset.add) { e.preventDefault(); return inlineAdd(e.target); }
  if (e.key === 'Enter' && e.target.dataset.dfield === 'title') { saveDraft(); return render(); }
  if (e.key === 'Enter' && e.target.dataset.m) return e.target.blur();
  if (e.key === '/' && cur === 'E1' && !e.target.closest('input,textarea,select')) { e.preventDefault(); document.getElementById('eline').focus(); }
});
const renderBase = render;
render = function () {
  if (!cur.startsWith('E')) { S.draft = null; S.menu = null; E1ed = null; }
  const ae = document.activeElement, keep = ae && ae.matches && ae.matches('#app input, #esheet input') ? { sel: ['add', 'dfield', 'm'].map(k => ae.dataset[k] && `[data-${k}="${ae.dataset[k]}"]`).find(Boolean), v: ae.value, c: ae.selectionStart } : null;
  renderBase();
  const em = cur.startsWith('E');
  document.body.classList.toggle('emode', em); document.body.classList.toggle('e3', cur === 'E3');
  document.getElementById('ebar').style.display = cur === 'E1' ? 'block' : 'none'; if (cur === 'E1') e1Preview();
  document.getElementById('efab').style.display = cur === 'E2' && !S.draft ? 'grid' : 'none';
  const sh = document.getElementById('esheet'), html = cur === 'E2' ? sheetE2() : cur === 'E3' ? menuE3() : '';
  if (sh.dataset.html !== html) { const fresh = !sh.dataset.html; sh.innerHTML = html; sh.dataset.html = html; if (fresh) sh.querySelector('[autofocus]')?.focus(); }
  if (keep && keep.sel) { const n = document.querySelector(keep.sel); if (n && n !== document.activeElement) { if (n.type !== 'date') n.value = keep.v; n.focus(); try { n.setSelectionRange(keep.c, keep.c); } catch {} } }

  if (em) {
    const ps = document.getElementById('pstate'), dump = JSON.parse(ps.textContent);
    dump.upcoming = S.tasks.filter(t => t.date > S.day && !t.skipped).map(t => `${dayLabel(t.date)}: ${t.parentId ? '↳ ' : ''}${t.title}${t.eventId ? ' @' + evById(t.eventId).title : ''}`);

reset();
const tq = new URLSearchParams(location.search).get('t'); // e.g. ?t=17:20 to open at a given time
if (tq) { const [h, m] = tq.split(':').map(Number); S.time = h * 60 + (m || 0); }

for (let i = +(new URLSearchParams(location.search).get('pile') || 0); i > 0; i--) pile(); // ?pile=2 adds 12 Tasks
render();
